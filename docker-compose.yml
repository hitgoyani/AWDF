services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: taskmanager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # 2. Node/Express Backend Container (Practical 4, 5, 6, 7, 9, 10, 13)
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskManagerDB
      - JWT_SECRET=super_secret_jwt_key_practical_7_24dit021_secure
      - JWT_EXPIRES_IN=24h
      - NODE_ENV=production
      - GEMINI_API_KEY=your_gemini_api_key_here
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. React Frontend Container (Practical 1, 2, 3, 6, 8)
  frontend:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# Named volume for persistent MongoDB storage across container lifecycles (Practical 11 Supplementary)
volumes:
  mongodb_data:
    driver: local

# Isolated bridge network for internal inter-container communication
networks:
  app-network:
    driver: bridge
