name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Validation (Practical 12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'task-manager-api/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./task-manager-api
        run: npm ci

      - name: Run Automated Test Suite (Jest + Supertest)
        working-directory: ./task-manager-api
        run: npm test

  frontend-build:
    name: Frontend Build & Verification (Practical 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'portfolio/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./portfolio
        run: npm ci

      - name: Build Production Bundle & Code Splitting Verification
        working-directory: ./portfolio
        run: npm run build
